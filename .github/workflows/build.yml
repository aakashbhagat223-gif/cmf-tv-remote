name: Build Real Google TV Remote

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Generate Working Remote Architecture
        run: |
          python3 - << 'EOF'
          import os

          files = {}

          # 1. Properties
          files["gradle.properties"] = """
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          """

          # 2. Settings configuration
          files["settings.gradle.kts"] = """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "cmf-tv-remote"
          include(":app")
          """

          # 3. Root build configuration
          files["build.gradle.kts"] = """
          plugins {
              id("com.android.application") version "8.4.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          """

          # 4. App module configuration
          files["app/build.gradle.kts"] = """
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.cmf.tvremote"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.cmf.tvremote"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 8
                  versionName = "3.1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                      excludes += "META-INF/INDEX.LIST"
                      excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
                      excludes += "META-INF/*.version"
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5")
              implementation("androidx.activity:activity-compose:1.9.2")
              
              val composeBom = platform("androidx.compose:compose-bom:2024.04.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          """

          # 5. Manifest
          files["app/src/main/AndroidManifest.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <application
                  android:name=".RemoteApplication"
                  android:allowBackup="true"
                  android:label="TV Remote"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """

          # 6. Remote Application
          files["app/src/main/java/com/cmf/tvremote/RemoteApplication.kt"] = """package com.cmf.tvremote
          import android.app.Application

          class RemoteApplication : Application()
          """

          # 7. Models
          files["app/src/main/java/com/cmf/tvremote/domain/model/Models.kt"] = """package com.cmf.tvremote.domain.model

          enum class RemoteCommand(val keyCode: Int) {
              POWER(26),
              DPAD_UP(19),
              DPAD_DOWN(20),
              DPAD_LEFT(21),
              DPAD_RIGHT(22),
              SELECT(23),
              BACK(4),
              HOME(3),
              ASSISTANT(219),
              VOLUME_UP(24),
              VOLUME_DOWN(25)
          }

          enum class ConnectionStatus {
              DISCONNECTED,
              PAIRING_REQUIRED,
              CONNECTING,
              CONNECTED
          }

          data class TvTelemetry(
              val status: ConnectionStatus = ConnectionStatus.DISCONNECTED,
              val statusMessage: String = "Tap here to connect TV",
              val tvIp: String = "Not set",
              val wifiSsid: String = "Disconnected",
              val wifiLinkSpeed: String = "0 Mbps",
              val pingLatencyMs: Long = 0
          )
          """

          # 8. Crypto: KeyStore & Hex Helpers
          files["app/src/main/java/com/cmf/tvremote/data/crypto/KeyStoreHelper.kt"] = """package com.cmf.tvremote.data.crypto

          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import java.math.BigInteger
          import java.security.KeyPairGenerator
          import java.security.KeyStore
          import java.security.SecureRandom
          import java.security.cert.X509Certificate
          import javax.net.ssl.KeyManagerFactory
          import javax.net.ssl.SSLContext
          import javax.net.ssl.TrustManager
          import javax.net.ssl.X509TrustManager
          import javax.security.auth.x500.X500Principal

          fun BigInteger.toRawHexBytes(): ByteArray {
              var hex = this.toString(16)
              if (hex.length % 2 != 0) hex = "0" + hex
              val len = hex.length
              val data = ByteArray(len / 2)
              var i = 0
              while (i < len) {
                  data[i / 2] = ((Character.digit(hex[i], 16) shl 4) + Character.digit(hex[i + 1], 16)).toByte()
                  i += 2
              }
              return data
          }

          object KeyStoreHelper {
              private const val ALIAS = "cmf_google_tv_remote_key"
              private var cachedCert: X509Certificate? = null
              var lastServerCertificate: X509Certificate? = null

              fun getOrCreateCertificate(): X509Certificate {
                  cachedCert?.let { return it }
                  val keyStore = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
                  if (!keyStore.containsAlias(ALIAS)) {
                      val kpg = KeyPairGenerator.getInstance(KeyProperties.KEY_ALGORITHM_RSA, "AndroidKeyStore")
                      val spec = KeyGenParameterSpec.Builder(ALIAS, KeyProperties.PURPOSE_SIGN or KeyProperties.PURPOSE_VERIFY)
                          .setDigests(KeyProperties.DIGEST_SHA256)
                          .setSignaturePaddings(KeyProperties.SIGNATURE_PADDING_RSA_PKCS1)
                          .setCertificateSubject(X500Principal("CN=atvremote, O=Google, C=US"))
                          .setCertificateSerialNumber(BigInteger.ONE)
                          .setKeySize(2048)
                          .build()
                      kpg.initialize(spec)
                      kpg.generateKeyPair()
                  }
                  val cert = keyStore.getCertificate(ALIAS) as X509Certificate
                  cachedCert = cert
                  return cert
              }

              fun buildSslContext(): SSLContext {
                  val keyStore = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
                  getOrCreateCertificate()

                  val kmf = KeyManagerFactory.getInstance(KeyManagerFactory.getDefaultAlgorithm()).apply {
                      init(keyStore, null)
                  }

                  val trustManager = object : X509TrustManager {
                      override fun checkClientTrusted(chain: Array<X509Certificate>?, authType: String?) {}
                      override fun checkServerTrusted(chain: Array<X509Certificate>?, authType: String?) {
                          if (!chain.isNullOrEmpty()) {
                              lastServerCertificate = chain[0]
                          }
                      }
                      override fun getAcceptedIssuers(): Array<X509Certificate> = arrayOf()
                  }

                  return SSLContext.getInstance("TLSv1.3").apply {
                      init(kmf.keyManagers, arrayOf<TrustManager>(trustManager), SecureRandom())
                  }
              }
          }
          """

          # 9. Protocol: Google TV Protocol Engine (Pairing & Command Channel)
          files["app/src/main/java/com/cmf/tvremote/data/network/GoogleTvProtocol.kt"] = """package com.cmf.tvremote.data.network

          import com.cmf.tvremote.data.crypto.KeyStoreHelper
          import com.cmf.tvremote.data.crypto.toRawHexBytes
          import com.cmf.tvremote.domain.model.RemoteCommand
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.DataInputStream
          import java.io.DataOutputStream
          import java.io.InputStream
          import java.io.OutputStream
          import java.net.InetSocketAddress
          import java.security.MessageDigest
          import java.security.interfaces.RSAPublicKey
          import javax.net.ssl.SSLSocket

          object GoogleTvProtocol {
              private var commandSocket: SSLSocket? = null
              private var commandOut: OutputStream? = null

              suspend fun startPairing(tvIp: String): Result<PairingSession> = withContext(Dispatchers.IO) {
                  runCatching {
                      val sslContext = KeyStoreHelper.buildSslContext()
                      val socket = sslContext.socketFactory.createSocket() as SSLSocket
                      socket.connect(InetSocketAddress(tvIp, 6467), 4000)
                      socket.startHandshake()

                      val out = socket.outputStream
                      val inStream = socket.inputStream

                      val serviceNameBytes = "androidtv-remote".toByteArray()
                      val clientNameBytes = "CMF Phone (2)".toByteArray()
                      val pairingReqPayload = byteArrayOf(0x0a, serviceNameBytes.size.toByte()) + serviceNameBytes +
                              byteArrayOf(0x12, clientNameBytes.size.toByte()) + clientNameBytes
                      sendPoloMessage(out, 10, pairingReqPayload)

                      readPoloMessage(inStream)

                      val configPayload = byteArrayOf(0x0a, 0x06, 0x08, 0x03, 0x10, 0x02, 0x18, 0x06, 0x10, 0x01)
                      sendPoloMessage(out, 30, configPayload)

                      readPoloMessage(inStream)
                      PairingSession(socket, inStream, out)
                  }
              }

              class PairingSession(
                  private val socket: SSLSocket,
                  private val inStream: InputStream,
                  private val out: OutputStream
              ) {
                  suspend fun completeWithPin(pin: String): Result<Unit> = withContext(Dispatchers.IO) {
                      runCatching {
                          val cleanPin = pin.trim().uppercase()
                          require(cleanPin.length == 6) { "PIN must be exactly 6 characters" }

                          val clientCert = KeyStoreHelper.getOrCreateCertificate()
                          val serverCert = KeyStoreHelper.lastServerCertificate
                              ?: throw IllegalStateException("Server certificate not captured")

                          val clientKey = clientCert.publicKey as RSAPublicKey
                          val serverKey = serverCert.publicKey as RSAPublicKey

                          val md = MessageDigest.getInstance("SHA-256")
                          md.update(clientKey.modulus.toRawHexBytes())
                          md.update(clientKey.publicExponent.toRawHexBytes())
                          md.update(serverKey.modulus.toRawHexBytes())
                          md.update(serverKey.publicExponent.toRawHexBytes())

                          val last4Hex = cleanPin.substring(2)
                          val randomBytes = ByteArray(last4Hex.length / 2) { i ->
                              ((Character.digit(last4Hex[i * 2], 16) shl 4) + Character.digit(last4Hex[i * 2 + 1], 16)).toByte()
                          }
                          md.update(randomBytes)
                          val hash = md.digest()

                          val expectedCheck = cleanPin.substring(0, 2).toInt(16)
                          val actualCheck = hash[0].toInt() and 0xFF
                          require(expectedCheck == actualCheck) { "PIN checksum mismatch. Verify code on TV." }

                          val secretPayload = byteArrayOf(0x0a, 0x20) + hash
                          sendPoloMessage(out, 40, secretPayload)

                          val (ackType, _) = readPoloMessage(inStream)
                          require(ackType == 41) { "TV rejected pairing secret." }

                          socket.close()
                      }
                  }
              }

              private fun sendPoloMessage(out: OutputStream, type: Int, payload: ByteArray) {
                  val outer = byteArrayOf(0x08, 0x01, 0x10, 0xc8.toByte(), 0x01, 0x18, type.toByte(), 0x22, payload.size.toByte()) + payload
                  val dos = DataOutputStream(out)
                  dos.writeInt(outer.size)
                  dos.write(outer)
                  dos.flush()
              }

              private fun readPoloMessage(inStream: InputStream): Pair<Int, ByteArray> {
                  val dis = DataInputStream(inStream)
                  val length = dis.readInt()
                  val buf = ByteArray(length)
                  dis.readFully(buf)
                  var type = 0
                  var i = 0
                  while (i < buf.size) {
                      val tag = buf[i].toInt() and 0xFF
                      if (tag == 0x18) {
                          type = buf[i + 1].toInt() and 0xFF
                          break
                      }
                      i++
                  }
                  return Pair(type, buf)
              }

              suspend fun connectCommandChannel(tvIp: String): Result<Unit> = withContext(Dispatchers.IO) {
                  runCatching {
                      disconnect()
                      val sslContext = KeyStoreHelper.buildSslContext()
                      val socket = sslContext.socketFactory.createSocket() as SSLSocket
                      socket.connect(InetSocketAddress(tvIp, 6466), 4000)
                      socket.startHandshake()

                      val out = socket.outputStream

                      val configureBytes = byteArrayOf(
                          0x24, 0x0a, 0x22, 0x08, 0xee.toByte(), 0x04, 0x12, 0x1d, 0x18, 0x01, 0x22, 0x01, 0x31,
                          0x2a, 0x0f, 0x61, 0x6e, 0x64, 0x72, 0x6f, 0x69, 0x74, 0x76, 0x2d, 0x72, 0x65, 0x6d, 0x6f, 0x74, 0x65,
                          0x32, 0x05, 0x31, 0x2e, 0x30, 0x2e, 0x30
                      )
                      out.write(configureBytes)
                      out.flush()

                      commandSocket = socket
                      commandOut = out
                  }
              }

              suspend fun sendCommand(cmd: RemoteCommand): Result<Unit> = withContext(Dispatchers.IO) {
                  runCatching {
                      val out = commandOut ?: throw IllegalStateException("Not connected")
                      val inject = byteArrayOf(0x08, cmd.keyCode.toByte(), 0x10, 0x03)
                      val packet = byteArrayOf(0x72, inject.size.toByte()) + inject
                      out.write(byteArrayOf(packet.size.toByte()) + packet)
                      out.flush()
                  }
              }

              fun disconnect() {
                  runCatching {
                      commandOut?.close()
                      commandSocket?.close()
                  }
                  commandOut = null
                  commandSocket = null
              }
          }
          """

          # 10. Settings Engine
          files["app/src/main/java/com/cmf/tvremote/SettingsEngine.kt"] = """package com.cmf.tvremote

          import android.content.Context
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.datastore.preferences.core.*
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.catch
          import kotlinx.coroutines.flow.map
          import java.io.IOException

          val Context.settingsDataStore by preferencesDataStore(name = "remote_ui_settings")

          enum class WallpaperTheme(val displayName: String) {
              WARM_AURORA("Warm Aurora Gradient"),
              DEEP_SLATE("Deep Slate Minimalist"),
              OLED_BLACK("OLED Pitch Black")
          }

          data class RemoteUiSettings(
              val fontScale: Float = 1.0f,
              val fontWeightIndex: Int = 2,
              val squircleRadiusDp: Float = 26f,
              val wallpaperTheme: WallpaperTheme = WallpaperTheme.WARM_AURORA
          ) {
              val fontWeight: FontWeight
                  get() = when (fontWeightIndex) {
                      0 -> FontWeight.Thin
                      1 -> FontWeight.Light
                      2 -> FontWeight.Normal
                      3 -> FontWeight.Medium
                      4 -> FontWeight.Bold
                      else -> FontWeight.Normal
                  }

              val cornerRadius: Dp
                  get() = squircleRadiusDp.dp
          }

          class SettingsEngine(private val context: Context) {
              private object PreferencesKeys {
                  val FONT_SCALE = floatPreferencesKey("pref_font_scale")
                  val FONT_WEIGHT_INDEX = intPreferencesKey("pref_font_weight_idx")
                  val SQUIRCLE_RADIUS = floatPreferencesKey("pref_squircle_radius")
                  val WALLPAPER_THEME = stringPreferencesKey("pref_wallpaper_theme")
                  val SAVED_TV_IP = stringPreferencesKey("pref_saved_tv_ip")
              }

              val settingsFlow: Flow<RemoteUiSettings> = context.settingsDataStore.data
                  .catch { if (it is IOException) emit(emptyPreferences()) else throw it }
                  .map { prefs ->
                      val scale = prefs[PreferencesKeys.FONT_SCALE] ?: 1.0f
                      val weightIdx = prefs[PreferencesKeys.FONT_WEIGHT_INDEX] ?: 2
                      val radius = prefs[PreferencesKeys.SQUIRCLE_RADIUS] ?: 26f
                      val themeName = prefs[PreferencesKeys.WALLPAPER_THEME] ?: WallpaperTheme.WARM_AURORA.name
                      val theme = runCatching { WallpaperTheme.valueOf(themeName) }.getOrDefault(WallpaperTheme.WARM_AURORA)

                      RemoteUiSettings(
                          fontScale = scale.coerceIn(0.8f, 1.3f),
                          fontWeightIndex = weightIdx.coerceIn(0, 4),
                          squircleRadiusDp = radius.coerceIn(8f, 34f),
                          wallpaperTheme = theme
                      )
                  }

              val savedIpFlow: Flow<String> = context.settingsDataStore.data
                  .catch { emit(emptyPreferences()) }
                  .map { it[PreferencesKeys.SAVED_TV_IP] ?: "" }

              suspend fun saveTvIp(ip: String) {
                  context.settingsDataStore.edit { it[PreferencesKeys.SAVED_TV_IP] = ip }
              }

              suspend fun updateFontScale(scale: Float) {
                  context.settingsDataStore.edit { it[PreferencesKeys.FONT_SCALE] = scale }
              }

              suspend fun updateFontWeight(weightIndex: Int) {
                  context.settingsDataStore.edit { it[PreferencesKeys.FONT_WEIGHT_INDEX] = weightIndex }
              }

              suspend fun updateSquircleRadius(radiusDp: Float) {
                  context.settingsDataStore.edit { it[PreferencesKeys.SQUIRCLE_RADIUS] = radiusDp }
              }

              suspend fun updateWallpaperTheme(theme: WallpaperTheme) {
                  context.settingsDataStore.edit { it[PreferencesKeys.WALLPAPER_THEME] = theme.name }
              }
          }
          """

          # 11. Components (Sharp Frosted Glass Surfaces)
          files["app/src/main/java/com/cmf/tvremote/Components.kt"] = """package com.cmf.tvremote

          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.animation.core.spring
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.interaction.MutableInteractionSource
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.KeyboardArrowLeft
          import androidx.compose.material.icons.automirrored.filled.KeyboardArrowRight
          import androidx.compose.material.icons.filled.KeyboardArrowDown
          import androidx.compose.material.icons.filled.KeyboardArrowUp
          import androidx.compose.material3.Icon
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.shadow
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.hapticfeedback.HapticFeedbackType
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalHapticFeedback
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.*
          import com.cmf.tvremote.domain.model.RemoteCommand

          class SquircleShape(val cornerRadius: Dp, private val smoothness: Float = 0.65f) : Shape {
              override fun createOutline(size: Size, layoutDirection: LayoutDirection, density: Density): Outline {
                  val r = with(density) { cornerRadius.toPx() }.coerceAtMost(minOf(size.width, size.height) / 2f)
                  val c = r * smoothness
                  val w = size.width
                  val h = size.height

                  val path = Path().apply {
                      moveTo(r, 0f)
                      lineTo(w - r, 0f)
                      cubicTo(w - c, 0f, w, c, w, r)
                      lineTo(w, h - r)
                      cubicTo(w, h - c, w - c, h, w - r, h)
                      lineTo(r, h)
                      cubicTo(c, h, 0f, h - c, 0f, h - r)
                      lineTo(0f, r)
                      cubicTo(0f, c, c, 0f, r, 0f)
                      close()
                  }
                  return Outline.Generic(path)
              }
          }

          fun Modifier.iosGlassmorphicSurface(
              shape: Shape = RoundedCornerShape(24.dp),
              tintAlpha: Float = 0.12f,
              borderAlpha: Float = 0.28f,
              elevation: Dp = 16.dp
          ): Modifier = this
              .shadow(
                  elevation = elevation,
                  shape = shape,
                  spotColor = Color.Black.copy(alpha = 0.45f),
                  ambientColor = Color.Black.copy(alpha = 0.25f)
              )
              .clip(shape)
              .background(
                  brush = Brush.verticalGradient(
                      colors = listOf(
                          Color.White.copy(alpha = tintAlpha + 0.05f),
                          Color.White.copy(alpha = tintAlpha)
                      )
                  )
              )
              .border(
                  width = 1.dp,
                  brush = Brush.verticalGradient(
                      colors = listOf(
                          Color.White.copy(alpha = borderAlpha + 0.12f),
                          Color.White.copy(alpha = borderAlpha * 0.35f)
                      )
                  ),
                  shape = shape
              )

          @Composable
          fun SquircleDPad(
              onCommand: (RemoteCommand) -> Unit,
              radius: Dp,
              modifier: Modifier = Modifier
          ) {
              val haptic = LocalHapticFeedback.current
              val outerShape = SquircleShape(cornerRadius = radius + 6.dp)
              val innerShape = SquircleShape(cornerRadius = (radius * 0.65f))

              Box(
                  modifier = modifier
                      .size(236.dp)
                      .iosGlassmorphicSurface(
                          shape = outerShape,
                          tintAlpha = 0.14f,
                          borderAlpha = 0.30f,
                          elevation = 16.dp
                      ),
                  contentAlignment = Alignment.Center
              ) {
                  Box(
                      modifier = Modifier
                          .align(Alignment.TopCenter)
                          .fillMaxWidth()
                          .fillMaxHeight(0.34f)
                          .clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) {
                              haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                              onCommand(RemoteCommand.DPAD_UP)
                          },
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(Icons.Default.KeyboardArrowUp, "Up", tint = Color.White.copy(alpha = 0.95f), modifier = Modifier.size(34.dp))
                  }

                  Box(
                      modifier = Modifier
                          .align(Alignment.BottomCenter)
                          .fillMaxWidth()
                          .fillMaxHeight(0.34f)
                          .clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) {
                              haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                              onCommand(RemoteCommand.DPAD_DOWN)
                          },
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(Icons.Default.KeyboardArrowDown, "Down", tint = Color.White.copy(alpha = 0.95f), modifier = Modifier.size(34.dp))
                  }

                  Box(
                      modifier = Modifier
                          .align(Alignment.CenterStart)
                          .fillMaxHeight()
                          .fillMaxWidth(0.34f)
                          .clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) {
                              haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                              onCommand(RemoteCommand.DPAD_LEFT)
                          },
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(Icons.AutoMirrored.Filled.KeyboardArrowLeft, "Left", tint = Color.White.copy(alpha = 0.95f), modifier = Modifier.size(34.dp))
                  }

                  Box(
                      modifier = Modifier
                          .align(Alignment.CenterEnd)
                          .fillMaxHeight()
                          .fillMaxWidth(0.34f)
                          .clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) {
                              haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                              onCommand(RemoteCommand.DPAD_RIGHT)
                          },
                      contentAlignment = Alignment.Center
                  ) {
