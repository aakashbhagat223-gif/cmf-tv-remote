          @Composable
          fun MacroCard(title: String, sequence: String, onRun: (String) -> Unit) {
              var seqState by remember { mutableStateOf(sequence) }
              Column(
                  modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(20.dp)).background(Color(0xFF1B1D24)).padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Text(title, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                  Box(
                      modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).background(Color(0xFF13151A)).padding(12.dp)
                  ) {
                      Text(seqState, color = Color.White.copy(alpha = 0.85f), fontSize = 12.sp)
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                      Text("Test", color = Color(0xFF60A5FA), fontSize = 13.sp, fontWeight = FontWeight.Bold, modifier = Modifier.clickable { onRun(seqState) })
                      Text("Reset", color = Color.White.copy(alpha = 0.5f), fontSize = 13.sp, modifier = Modifier.clickable { seqState = sequence })
                  }
              }
          }

          @Composable
          fun SettingsTabScreen(
              settings: RemoteUiSettings,
              engine: SettingsEngine,
              onPairClick: () -> Unit
          ) {
              val scope = rememberCoroutineScope()
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .statusBarsPadding()
                      .padding(horizontal = 20.dp)
                      .verticalScroll(rememberScrollState()),
                  verticalArrangement = Arrangement.spacedBy(18.dp)
              ) {
                  Text("Settings", fontSize = 32.sp, fontWeight = FontWeight.Bold, color = Color.White, modifier = Modifier.padding(top = 8.dp))

                  Button(
                      onClick = onPairClick,
                      modifier = Modifier.fillMaxWidth().height(50.dp),
                      shape = RoundedCornerShape(14.dp)
                  ) {
                      Text("Pair / Change TV IP")
                  }

                  Column(Modifier.fillMaxWidth().clip(RoundedCornerShape(20.dp)).background(Color(0xFF1B1D24)).padding(16.dp)) {
                      Text("Squircle Radius: " + settings.squircleRadiusDp.toInt().toString() + " dp", color = Color.White)
                      Slider(
                          value = settings.squircleRadiusDp,
                          onValueChange = { scope.launch { engine.updateSquircleRadius(it) } },
                          valueRange = 8f..34f
                      )
                  }

                  Column(Modifier.fillMaxWidth().clip(RoundedCornerShape(20.dp)).background(Color(0xFF1B1D24)).padding(16.dp)) {
                      Text("Typography Scale: " + String.format("%.2f", settings.fontScale) + "x", color = Color.White)
                      Slider(
                          value = settings.fontScale,
                          onValueChange = { scope.launch { engine.updateFontScale(it) } },
                          valueRange = 0.8f..1.3f
                      )
                  }

                  Column(Modifier.fillMaxWidth().clip(RoundedCornerShape(20.dp)).background(Color(0xFF1B1D24)).padding(16.dp)) {
                      Text("Atmosphere Theme", color = Color.White)
                      Spacer(Modifier.height(8.dp))
                      WallpaperTheme.values().forEach { theme ->
                          Row(
                              modifier = Modifier.fillMaxWidth().clickable { scope.launch { engine.updateWallpaper(theme) } }.padding(vertical = 6.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              RadioButton(selected = settings.wallpaperTheme == theme, onClick = { scope.launch { engine.updateWallpaper(theme) } })
                              Spacer(Modifier.width(8.dp))
                              Text(theme.displayName, color = Color.White, fontSize = 14.sp)
                          }
                      }
                  }
                  Spacer(Modifier.height(16.dp))
              }
          }
          """)

