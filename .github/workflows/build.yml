          @Composable
          fun BacklightSpringSlider(
              onIncrement: () -> Unit,
              onDecrement: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              val context = LocalContext.current
              val vibrator = remember { context.getSystemService(Vibrator::class.java) }
              val scope = rememberCoroutineScope()
              var trackWidthPx by remember { mutableFloatStateOf(0f) }
              val handleOffsetX = remember { Animatable(0f) }
              var repeatJob by remember { mutableStateOf<Job?>(null) }
              val deadZone = 18f
              val maxTravel = (trackWidthPx / 2f) - 32f

              Box(
                  modifier = modifier
                      .fillMaxWidth()
                      .height(56.dp)
                      .clip(RoundedCornerShape(28.dp))
                      .background(Color(0xFF22252B))
                      .onSizeChanged { trackWidthPx = it.width.toFloat() }
                      .pointerInput(trackWidthPx) {
                          detectHorizontalDragGestures(
                              onDragStart = { repeatJob?.cancel() },
                              onHorizontalDrag = { change, dragAmount ->
                                  change.consume()
                                  scope.launch {
                                      val newTarget = (handleOffsetX.value + dragAmount).coerceIn(-maxTravel, maxTravel)
                                      handleOffsetX.snapTo(newTarget)

                                      if (abs(newTarget) >= maxTravel - 2f) {
                                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                              vibrator?.vibrate(VibrationEffect.createOneShot(35, VibrationEffect.DEFAULT_AMPLITUDE))
                                          }
                                      }

                                      val offset = handleOffsetX.value
                                      if (abs(offset) > deadZone) {
                                          val isRight = offset > 0
                                          val ratio = ((abs(offset) - deadZone) / (maxTravel - deadZone)).coerceIn(0.1f, 1f)
                                          val intervalMs = (400 - (280 * ratio)).toLong()

                                          if (repeatJob?.isActive != true) {
                                              repeatJob = scope.launch {
                                                  while (isActive) {
                                                      if (isRight) onIncrement() else onDecrement()
                                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                                          vibrator?.vibrate(VibrationEffect.createPredefined(VibrationEffect.EFFECT_TICK))
                                                      }
                                                      delay(intervalMs)
                                                  }
                                              }
                                          }
                                      } else {
                                          repeatJob?.cancel()
                                      }
                                  }
                              },
                              onDragEnd = {
                                  repeatJob?.cancel()
                                  scope.launch {
                                      handleOffsetX.animateTo(0f, spring(Spring.DampingRatioMediumBouncy, Spring.StiffnessLow))
                                  }
                              },
                              onDragCancel = {
                                  repeatJob?.cancel()
                                  scope.launch { handleOffsetX.animateTo(0f) }
                              }
                          )
                      },
                  contentAlignment = Alignment.Center
              ) {
                  Text("—", color = Color.White.copy(alpha = 0.6f), fontSize = 20.sp, fontWeight = FontWeight.Bold, modifier = Modifier.align(Alignment.CenterStart).padding(start = 20.dp))
                  Box(Modifier.width(2.dp).height(18.dp).background(Color.White.copy(alpha = 0.15f)))
                  Text("+", color = Color.White.copy(alpha = 0.6f), fontSize = 22.sp, fontWeight = FontWeight.Bold, modifier = Modifier.align(Alignment.CenterEnd).padding(end = 20.dp))
                  Box(
                      modifier = Modifier
                          .offset { IntOffset(handleOffsetX.value.roundToInt(), 0) }
                          .size(width = 54.dp, height = 44.dp)
                          .clip(RoundedCornerShape(22.dp))
                          .background(Color(0xFFE2E4EB))
                  )
              }
          }
          """)

