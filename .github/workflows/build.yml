                  }
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      DashTile("TV address", telemetry.tvIp, null, Modifier.weight(1f))
                      DashTile("This phone", telemetry.phoneIp, true, Modifier.weight(1f))
                  }
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
