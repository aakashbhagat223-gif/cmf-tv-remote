                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      DashTile("Volume", telemetry.volumeLevel.toString() + " / 100", null, Modifier.weight(1f))
                      DashTile("Power", if (telemetry.isPowerOn) "On" else "Off", null, Modifier.weight(1f))
                  }

                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .clip(RoundedCornerShape(24.dp))
                          .background(Color(0xFF1B1D24))
                          .padding(16.dp)
