                      .clip(RoundedCornerShape(20.dp))
                      .background(Color(0xFF1B1D24))
                      .padding(14.dp)
              ) {
                  Column {
                      Text(label, color = Color.White.copy(alpha = 0.5f), fontSize = 12.sp)
