name: Build HomeRemote+ Complete Architecture

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Generate Unified Architecture
        run: |
          python3 - << 'EOF'
          import os

          def write_file(path, content):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip() + "\n")

          write_file("gradle.properties", """
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          """)

          write_file("settings.gradle.kts", """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "cmf-tv-remote"
          include(":app")
          """)

          write_file("build.gradle.kts", """
          plugins {
              id("com.android.application") version "8.4.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          """)

          write_file("app/build.gradle.kts", """
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.cmf.tvremote"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.cmf.tvremote"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 12
                  versionName = "4.1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                      pickFirsts += "META-INF/**"
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5")
              implementation("androidx.activity:activity-compose:1.9.2")
              
              val composeBom = platform("androidx.compose:compose-bom:2024.04.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("org.bouncycastle:bcpkix-jdk18on:1.78.1")
          }
          """)

          write_file("app/src/main/res/values/strings.xml", """
          <resources>
              <string name="app_name">HomeRemote+</string>
          </resources>
          """)

          write_file("app/src/main/AndroidManifest.xml", """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:name=".RemoteApplication"
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """)

          write_file("app/src/main/java/com/cmf/tvremote/RemoteApplication.kt", """package com.cmf.tvremote
          import android.app.Application

          class RemoteApplication : Application()
          """)

          write_file("app/src/main/java/com/cmf/tvremote/domain/model/Models.kt", """package com.cmf.tvremote.domain.model

          enum class RemoteCommand(val keyCode: Int) {
              POWER(26),
              DPAD_UP(19),
              DPAD_DOWN(20),
              DPAD_LEFT(21),
              DPAD_RIGHT(22),
              SELECT(23),
              BACK(4),
              HOME(3),
              ASSISTANT(219),
              VOLUME_UP(24),
              VOLUME_DOWN(25),
              SETTINGS(176),
              MENU(82)
          }

          enum class ConnectionStatus {
              DISCONNECTED,
              PAIRING_REQUIRED,
              CONNECTING,
              CONNECTED
          }

          data class TvTelemetry(
              val status: ConnectionStatus = ConnectionStatus.DISCONNECTED,
              val statusMessage: String = "Tap to pair TV",
              val tvIp: String = "192.168.31.116",
              val phoneIp: String = "192.168.31.104",
              val wifiSsid: String = "JIO AIR FIBER_EXT",
              val wifiLinkSpeed: String = "65 Mbps",
              val pingLatencyMs: Long = 65,
              val volumeLevel: Int = 8,
              val isPowerOn: Boolean = true
          )

          data class MediaSessionInfo(
              val title: String = "Nothing reported",
              val subtitle: String = "This TV link doesn't share media info yet"
          )
          """)

          write_file("app/src/main/java/com/cmf/tvremote/data/crypto/KeyStoreHelper.kt", """package com.cmf.tvremote.data.crypto

          import android.content.Context
          import org.bouncycastle.asn1.x500.X500Name
          import org.bouncycastle.cert.jcajce.JcaX509CertificateConverter
          import org.bouncycastle.cert.jcajce.JcaX509v3CertificateBuilder
          import org.bouncycastle.operator.jcajce.JcaContentSignerBuilder
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.math.BigInteger
          import java.security.KeyPairGenerator
          import java.security.KeyStore
          import java.security.SecureRandom
          import java.security.cert.X509Certificate
          import java.util.Date
          import javax.net.ssl.KeyManagerFactory
          import javax.net.ssl.SSLContext
          import javax.net.ssl.TrustManager
          import javax.net.ssl.X509TrustManager

          fun BigInteger.toRawHexBytes(): ByteArray {
              var hex = this.toString(16)
              if (hex.length % 2 != 0) hex = "0" + hex
              val len = hex.length
              val data = ByteArray(len / 2)
              var i = 0
              while (i < len) {
                  data[i / 2] = ((Character.digit(hex[i], 16) shl 4) + Character.digit(hex[i + 1], 16)).toByte()
                  i += 2
              }
              return data
          }

          object KeyStoreHelper {
              private const val KS_FILE = "tv_remote_client.p12"
              private const val KS_PASS = "cmf_remote_pass"
              private const val ALIAS = "client_cert"

              private var cachedCert: X509Certificate? = null
              var lastServerCertificate: X509Certificate? = null

              fun initialize(context: Context) {
                  if (cachedCert != null) return
                  val file = File(context.filesDir, KS_FILE)
                  val ks = KeyStore.getInstance("PKCS12")

                  if (file.exists()) {
                      runCatching {
                          FileInputStream(file).use { fis -> ks.load(fis, KS_PASS.toCharArray()) }
                          val cert = ks.getCertificate(ALIAS) as? X509Certificate
                          val privKey = ks.getKey(ALIAS, KS_PASS.toCharArray())
                          if (cert != null && privKey != null) {
                              cachedCert = cert
                              return
                          }
                      }
                  }

                  val kpg = KeyPairGenerator.getInstance("RSA")
                  kpg.initialize(2048, SecureRandom())
                  val pair = kpg.generateKeyPair()

                  val now = System.currentTimeMillis()
                  val startDate = Date(now - 86400000L)
                  val endDate = Date(now + 20L * 365 * 24 * 3600 * 1000)
                  val dn = X500Name("CN=atvremote, O=Google, C=US")

                  val certBuilder = JcaX509v3CertificateBuilder(
                      dn,
                      BigInteger.valueOf(now),
                      startDate,
                      endDate,
                      dn,
                      pair.public
                  )
                  val signer = JcaContentSignerBuilder("SHA256withRSA").build(pair.private)
                  val cert = JcaX509CertificateConverter().getCertificate(certBuilder.build(signer))

                  ks.load(null, null)
                  ks.setKeyEntry(ALIAS, pair.private, KS_PASS.toCharArray(), arrayOf(cert))
                  FileOutputStream(file).use { fos -> ks.store(fos, KS_PASS.toCharArray()) }
                  cachedCert = cert
              }

              fun getCertificate(context: Context): X509Certificate {
                  initialize(context)
                  return cachedCert!!
              }

              fun buildSslContext(context: Context): SSLContext {
                  initialize(context)
                  val file = File(context.filesDir, KS_FILE)
                  val ks = KeyStore.getInstance("PKCS12")
                  FileInputStream(file).use { fis -> ks.load(fis, KS_PASS.toCharArray()) }

                  val kmf = KeyManagerFactory.getInstance(KeyManagerFactory.getDefaultAlgorithm())
                  kmf.init(ks, KS_PASS.toCharArray())

                  val trustManager = object : X509TrustManager {
                      override fun checkClientTrusted(chain: Array<X509Certificate>?, authType: String?) {}
                      override fun checkServerTrusted(chain: Array<X509Certificate>?, authType: String?) {
                          if (!chain.isNullOrEmpty()) {
                              lastServerCertificate = chain[0]
                          }
                      }
                      override fun getAcceptedIssuers(): Array<X509Certificate> = arrayOf()
                  }

                  return SSLContext.getInstance("TLS").apply {
                      init(kmf.keyManagers, arrayOf<TrustManager>(trustManager), SecureRandom())
                  }
              }
          }
          """)

          write_file("app/src/main/java/com/cmf/tvremote/data/network/GoogleTvProtocol.kt", """package com.cmf.tvremote.data.network

          import android.content.Context
          import com.cmf.tvremote.data.crypto.KeyStoreHelper
          import com.cmf.tvremote.data.crypto.toRawHexBytes
          import com.cmf.tvremote.domain.model.RemoteCommand
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.DataInputStream
          import java.io.DataOutputStream
          import java.io.InputStream
          import java.io.OutputStream
          import java.net.InetSocketAddress
          import java.nio.charset.StandardCharsets
          import java.security.MessageDigest
          import java.security.interfaces.RSAPublicKey
          import javax.net.ssl.SSLSocket

          object GoogleTvProtocol {
              private var commandSocket: SSLSocket? = null
              private var commandOut: OutputStream? = null

              suspend fun startPairing(context: Context, tvIp: String): Result<PairingSession> = withContext(Dispatchers.IO) {
                  runCatching {
                      val sslContext = KeyStoreHelper.buildSslContext(context)
                      val socket = sslContext.socketFactory.createSocket() as SSLSocket
                      socket.useClientMode = true
                      socket.connect(InetSocketAddress(tvIp, 6467), 4000)
                      socket.startHandshake()

                      val out = socket.outputStream
                      val inStream = socket.inputStream

                      val sName = "androidtv-remote".toByteArray()
                      val cName = "CMF Phone (2)".toByteArray()
                      val pPayload = byteArrayOf(0x0a, sName.size.toByte()) + sName + byteArrayOf(0x12, cName.size.toByte()) + cName
                      sendPoloMessage(out, 10, pPayload)
                      readPoloMessage(inStream)

                      val cfg = byteArrayOf(0x0a, 0x06, 0x08, 0x03, 0x10, 0x02, 0x18, 0x06, 0x10, 0x01)
                      sendPoloMessage(out, 30, cfg)
                      readPoloMessage(inStream)

                      PairingSession(socket, inStream, out)
                  }
              }

              class PairingSession(
                  private val socket: SSLSocket,
                  private val inStream: InputStream,
                  private val out: OutputStream
              ) {
                  suspend fun completeWithPin(context: Context, pin: String): Result<Unit> = withContext(Dispatchers.IO) {
                      runCatching {
                          val cleanPin = pin.trim().uppercase()
                          require(cleanPin.length == 6) { "PIN must be 6 characters" }

                          val clientCert = KeyStoreHelper.getCertificate(context)
                          val serverCert = KeyStoreHelper.lastServerCertificate ?: throw IllegalStateException("No cert")
                          val clientKey = clientCert.publicKey as RSAPublicKey
                          val serverKey = serverCert.publicKey as RSAPublicKey

                          val md = MessageDigest.getInstance("SHA-256")
                          md.update(clientKey.modulus.toRawHexBytes())
                          md.update(clientKey.publicExponent.toRawHexBytes())
                          md.update(serverKey.modulus.toRawHexBytes())
                          md.update(serverKey.publicExponent.toRawHexBytes())

                          val last4Hex = cleanPin.substring(2)
                          val randomBytes = ByteArray(last4Hex.length / 2) { i ->
                              ((Character.digit(last4Hex[i * 2], 16) shl 4) + Character.digit(last4Hex[i * 2 + 1], 16)).toByte()
                          }
                          md.update(randomBytes)
                          val hash = md.digest()

                          val expectedCheck = cleanPin.substring(0, 2).toInt(16)
                          val actualCheck = hash[0].toInt() and 0xFF
                          require(expectedCheck == actualCheck) { "Checksum mismatch" }

                          val secretPayload = byteArrayOf(0x0a, 0x20) + hash
                          sendPoloMessage(out, 40, secretPayload)

                          val (ackType, _) = readPoloMessage(inStream)
                          require(ackType == 41) { "Pairing rejected" }
                          socket.close()
                      }
                  }
              }

              private fun sendPoloMessage(out: OutputStream, type: Int, payload: ByteArray) {
                  val outer = byteArrayOf(0x08, 0x01, 0x10, 0xc8.toByte(), 0x01, 0x18, type.toByte(), 0x22, payload.size.toByte()) + payload
                  val dos = DataOutputStream(out)
                  dos.writeInt(outer.size)
                  dos.write(outer)
                  dos.flush()
              }

              private fun readPoloMessage(inStream: InputStream): Pair<Int, ByteArray> {
                  val dis = DataInputStream(inStream)
                  val length = dis.readInt()
                  val buf = ByteArray(length)
                  dis.readFully(buf)
                  var type = 0
                  var i = 0
                  while (i < buf.size) {
                      if ((buf[i].toInt() and 0xFF) == 0x18) {
                          type = buf[i + 1].toInt() and 0xFF
                          break
                      }
                      i++
                  }
                  return Pair(type, buf)
              }

              suspend fun connectCommandChannel(context: Context, tvIp: String): Result<Unit> = withContext(Dispatchers.IO) {
                  runCatching {
                      disconnect()
                      val sslContext = KeyStoreHelper.buildSslContext(context)
                      val socket = sslContext.socketFactory.createSocket() as SSLSocket
                      socket.useClientMode = true
                      socket.connect(InetSocketAddress(tvIp, 6466), 4000)
                      socket.startHandshake()

                      val out = socket.outputStream
                      val config = byteArrayOf(
                          0x24, 0x0a, 0x22, 0x08, 0xee.toByte(), 0x04, 0x12, 0x1d, 0x18, 0x01, 0x22, 0x01, 0x31,
                          0x2a, 0x0f, 0x61, 0x6e, 0x64, 0x72, 0x6f, 0x69, 0x74, 0x76, 0x2d, 0x72, 0x65, 0x6d, 0x6f,
                          0x74, 0x65, 0x32, 0x05, 0x31, 0x2e, 0x30, 0x2e, 0x30
                      )
                      out.write(config)
                      out.flush()

                      commandSocket = socket
                      commandOut = out
                  }
              }

              suspend fun sendCommand(cmd: RemoteCommand): Result<Unit> = withContext(Dispatchers.IO) {
                  runCatching {
                      val out = commandOut ?: throw IllegalStateException("Not connected")
                      val inject = byteArrayOf(0x08, cmd.keyCode.toByte(), 0x10, 0x03)
                      val packet = byteArrayOf(0x72, inject.size.toByte()) + inject
                      out.write(byteArrayOf(packet.size.toByte()) + packet)
                      out.flush()
                  }
              }

              suspend fun sendTextString(text: String): Result<Unit> = withContext(Dispatchers.IO) {
                  runCatching {
                      val out = commandOut ?: throw IllegalStateException("Not connected")
                      val b = text.toByteArray(StandardCharsets.UTF_8)
                      val ime = byteArrayOf(0x12, b.size.toByte()) + b
                      val msg = byteArrayOf(0x5a, ime.size.toByte()) + ime
                      out.write(byteArrayOf(msg.size.toByte()) + msg)
                      out.flush()
                  }
              }

              fun disconnect() {
                  runCatching {
                      commandOut?.close()
                      commandSocket?.close()
                  }
                  commandOut = null
                  commandSocket = null
              }
          }
          """)

          write_file("app/src/main/java/com/cmf/tvremote/domain/macro/MacroEngine.kt", """package com.cmf.tvremote.domain.macro

          import com.cmf.tvremote.data.network.GoogleTvProtocol
          import com.cmf.tvremote.domain.model.RemoteCommand
          import kotlinx.coroutines.delay

          object MacroEngine {
              suspend fun executeSequence(sequenceRaw: String) {
                  val tokens = sequenceRaw.trim().split("\\\\s+".toRegex())
                  var idx = 0
                  while (idx < tokens.size) {
                      val token = tokens[idx]
                      when {
                          token == "WAIT" -> {
                              val dur = tokens.getOrNull(idx + 1)?.toLongOrNull() ?: 200L
                              delay(dur)
                              idx += 2
                          }
                          token.contains("*") -> {
                              val parts = token.split("*")
                              val keyToken = parts[0]
                              val count = parts.getOrNull(1)?.toIntOrNull() ?: 1
                              val cmd = mapTokenToCommand(keyToken)
                              repeat(count) {
                                  cmd?.let { GoogleTvProtocol.sendCommand(it) }
                                  delay(200)
                              }
                              idx++
                          }
                          token == "QUICK" && tokens.getOrNull(idx + 1) == "SETTINGS" -> {
                              GoogleTvProtocol.sendCommand(RemoteCommand.SETTINGS)
                              idx += 2
                              delay(200)
                          }
                          else -> {
                              val cmd = mapTokenToCommand(token)
                              cmd?.let { GoogleTvProtocol.sendCommand(it) }
                              delay(200)
                              idx++
                          }
                      }
                  }
              }

              private fun mapTokenToCommand(token: String): RemoteCommand? = when (token.uppercase()) {
                  "HOME" -> RemoteCommand.HOME
                  "OK" -> RemoteCommand.SELECT
                  "BACK" -> RemoteCommand.BACK
                  "UP" -> RemoteCommand.DPAD_UP
                  "DOWN" -> RemoteCommand.DPAD_DOWN
                  "LEFT" -> RemoteCommand.DPAD_LEFT
                  "RIGHT" -> RemoteCommand.DPAD_RIGHT
                  "SETTINGS" -> RemoteCommand.SETTINGS
                  "MENU" -> RemoteCommand.MENU
                  "POWER" -> RemoteCommand.POWER
                  else -> null
              }
          }
          """)

          write_file("app/src/main/java/com/cmf/tvremote/SettingsEngine.kt", """package com.cmf.tvremote

          import android.content.Context
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.datastore.preferences.core.*
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.catch
          import kotlinx.coroutines.flow.map
          import java.io.IOException

          val Context.settingsDataStore by preferencesDataStore(name = "remote_ui_settings")

          enum class WallpaperTheme(val displayName: String) {
              WARM_AURORA("Warm Aurora Gradient"),
              DEEP_SLATE("Deep Slate Minimalist"),
              OLED_BLACK("OLED Pitch Black")
          }

          data class RemoteUiSettings(
              val fontScale: Float = 1.0f,
              val squircleRadiusDp: Float = 24f,
              val wallpaperTheme: WallpaperTheme = WallpaperTheme.WARM_AURORA
          ) {
              val cornerRadius: Dp get() = squircleRadiusDp.dp
          }

          class SettingsEngine(private val context: Context) {
              private object Keys {
                  val FONT_SCALE = floatPreferencesKey("font_scale")
                  val SQUIRCLE_RADIUS = floatPreferencesKey("squircle_radius")
                  val WALLPAPER = stringPreferencesKey("wallpaper")
                  val SAVED_IP = stringPreferencesKey("saved_ip")
                  val MACRO_STREMIO = stringPreferencesKey("macro_stremio")
                  val MACRO_HDMI2 = stringPreferencesKey("macro_hdmi2")
                  val MACRO_BL_OPEN = stringPreferencesKey("macro_bl_open")
                  val MACRO_BL_CLOSE = stringPreferencesKey("macro_bl_close")
                  val BL_STEP_UNIT = intPreferencesKey("bl_step_unit")
              }

              val settingsFlow: Flow<RemoteUiSettings> = context.settingsDataStore.data
                  .catch { if (it is IOException) emit(emptyPreferences()) else throw it }
                  .map { prefs ->
                      RemoteUiSettings(
                          fontScale = prefs[Keys.FONT_SCALE] ?: 1.0f,
                          squircleRadiusDp = prefs[Keys.SQUIRCLE_RADIUS] ?: 24f,
                          wallpaperTheme = runCatching {
                              WallpaperTheme.valueOf(prefs[Keys.WALLPAPER] ?: "")
                          }.getOrDefault(WallpaperTheme.WARM_AURORA)
                      )
                  }

              val savedIpFlow: Flow<String> = context.settingsDataStore.data
                  .catch { emit(emptyPreferences()) }
                  .map { it[Keys.SAVED_IP] ?: "" }

              suspend fun saveTvIp(ip: String) {
                  context.settingsDataStore.edit { it[Keys.SAVED_IP] = ip }
              }

              suspend fun updateFontScale(s: Float) {
                  context.settingsDataStore.edit { it[Keys.FONT_SCALE] = s }
              }

              suspend fun updateSquircleRadius(r: Float) {
                  context.settingsDataStore.edit { it[Keys.SQUIRCLE_RADIUS] = r }
              }

              suspend fun updateWallpaper(t: WallpaperTheme) {
                  context.settingsDataStore.edit { it[Keys.WALLPAPER] = t.name }
              }

              fun getMacroFlow(key: String, default: String): Flow<String> = context.settingsDataStore.data
                  .catch { emit(emptyPreferences()) }
                  .map { it[stringPreferencesKey(key)] ?: default }

              suspend fun saveMacro(key: String, value: String) {
                  context.settingsDataStore.edit { it[stringPreferencesKey(key)] = value }
              }
          }
          """)

          write_file("app/src/main/java/com/cmf/tvremote/Components.kt", """package com.cmf.tvremote

          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import androidx.compose.animation.core.Animatable
          import androidx.compose.animation.core.Spring
          import androidx.compose.animation.core.spring
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectHorizontalDragGestures
          import androidx.compose.foundation.interaction.MutableInteractionSource
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.KeyboardArrowLeft
          import androidx.compose.material.icons.automirrored.filled.KeyboardArrowRight
          import androidx.compose.material.icons.filled.KeyboardArrowDown
          import androidx.compose.material.icons.filled.KeyboardArrowUp
          import androidx.compose.material3.Icon
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.shadow
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.hapticfeedback.HapticFeedbackType
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.onSizeChanged
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalHapticFeedback
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.*
          import com.cmf.tvremote.domain.model.RemoteCommand
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.isActive
          import kotlinx.coroutines.launch
          import kotlin.math.abs
          import kotlin.math.roundToInt

          class SquircleShape(val cornerRadius: Dp, private val smoothness: Float = 0.65f) : Shape {
              override fun createOutline(size: Size, layoutDirection: LayoutDirection, density: Density): Outline {
                  val r = with(density) { cornerRadius.toPx() }.coerceAtMost(minOf(size.width, size.height) / 2f)
                  val c = r * smoothness
                  val w = size.width
                  val h = size.height

                  val path = Path().apply {
                      moveTo(r, 0f)
                      lineTo(w - r, 0f)
                      cubicTo(w - c, 0f, w, c, w, r)
                      lineTo(w, h - r)
                      cubicTo(w, h - c, w - c, h, w - r, h)
                      lineTo(r, h)
                      cubicTo(c, h, 0f, h - c, 0f, h - r)
                      lineTo(0f, r)
                      cubicTo(0f, c, c, 0f, r, 0f)
                      close()
                  }
                  return Outline.Generic(path)
              }
          }

          fun Modifier.iosGlassmorphicSurface(
              shape: Shape = RoundedCornerShape(24.dp),
              tintAlpha: Float = 0.12f,
