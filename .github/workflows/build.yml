name: Generate Project, Zip & Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Generate Android Project Files
        run: |
          python3 - << 'EOF'
          import os

          files = {}

          # 1. Properties file (Fixes checkDebugAarMetadata error)
          files["gradle.properties"] = """
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          """

          # 2. Settings configuration
          files["settings.gradle.kts"] = """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "cmf-tv-remote"
          include(":app")
          """

          # 3. Root build configuration
          files["build.gradle.kts"] = """
          plugins {
              id("com.android.application") version "8.4.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          """

          # 4. App module configuration
          files["app/build.gradle.kts"] = """
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.cmf.tvremote"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.cmf.tvremote"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5")
              implementation("androidx.activity:activity-compose:1.9.2")
              
              val composeBom = platform("androidx.compose:compose-bom:2024.04.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.bouncycastle:bcpkix-jdk18on:1.78.1")
          }
          """

          # 5. Manifest
          files["app/src/main/AndroidManifest.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-feature android:name="android.hardware.consumerir" android:required="false" />
              <application
                  android:name=".RemoteApplication"
                  android:allowBackup="true"
                  android:label="TV Remote"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """

          # 6. Source Files
          files["app/src/main/java/com/cmf/tvremote/RemoteApplication.kt"] = """package com.cmf.tvremote
          import android.app.Application

          class RemoteApplication : Application()
          """

          files["app/src/main/java/com/cmf/tvremote/domain/model/Models.kt"] = """package com.cmf.tvremote.domain.model

          enum class RemoteCommand {
              POWER, DPAD_UP, DPAD_DOWN, DPAD_LEFT, DPAD_RIGHT, SELECT,
              BACK, HOME, ASSISTANT, VOLUME_UP, VOLUME_DOWN
          }

          data class TvConnectionState(
              val isConnected: Boolean = true,
              val connectedIp: String = "192.168.1.114",
              val pingLatencyMs: Long = 12,
              val activeInput: String = "HDMI 1 (eARC)",
              val nowPlayingTitle: String = "Interstellar",
              val nowPlayingArtist: String = "4K HDR • Dolby Atmos"
          )
          """

          files["app/src/main/java/com/cmf/tvremote/data/ir/IrHardwareManager.kt"] = """package com.cmf.tvremote.data.ir
          import android.content.Context
          import android.content.pm.PackageManager

          class IrHardwareManager(private val context: Context) {
              val isIrSupported: Boolean
                  get() = context.packageManager.hasSystemFeature(PackageManager.FEATURE_CONSUMER_IR)
          }
          """

          files["app/src/main/java/com/cmf/tvremote/presentation/components/Components.kt"] = """package com.cmf.tvremote.presentation.components
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import com.cmf.tvremote.domain.model.RemoteCommand

          fun Modifier.glassmorphic(cornerRadius: Dp = 24.dp): Modifier = this
              .clip(RoundedCornerShape(cornerRadius))
              .background(Brush.verticalGradient(listOf(Color(0xFF2B2D33).copy(alpha = 0.5f), Color(0xFF15161A).copy(alpha = 0.7f))))
              .border(0.8.dp, Brush.verticalGradient(listOf(Color.White.copy(alpha = 0.2f), Color.White.copy(alpha = 0.05f))), RoundedCornerShape(cornerRadius))

          @Composable
          fun TactileDPad(onCommand: (RemoteCommand) -> Unit, modifier: Modifier = Modifier) {
              Box(
                  modifier = modifier.size(240.dp).clip(CircleShape).background(Color(0xFF1E1F24).copy(alpha = 0.7f)).border(1.dp, Color.White.copy(alpha = 0.15f), CircleShape),
                  contentAlignment = Alignment.Center
              ) {
                  IconButton(onClick = { onCommand(RemoteCommand.DPAD_UP) }, modifier = Modifier.align(Alignment.TopCenter).padding(top = 8.dp)) {
                      Icon(Icons.Default.KeyboardArrowUp, null, tint = Color.White)
                  }
                  IconButton(onClick = { onCommand(RemoteCommand.DPAD_DOWN) }, modifier = Modifier.align(Alignment.BottomCenter).padding(bottom = 8.dp)) {
                      Icon(Icons.Default.KeyboardArrowDown, null, tint = Color.White)
                  }
                  IconButton(onClick = { onCommand(RemoteCommand.DPAD_LEFT) }, modifier = Modifier.align(Alignment.CenterStart).padding(start = 8.dp)) {
                      Icon(Icons.Default.KeyboardArrowLeft, null, tint = Color.White)
                  }
                  IconButton(onClick = { onCommand(RemoteCommand.DPAD_RIGHT) }, modifier = Modifier.align(Alignment.CenterEnd).padding(end = 8.dp)) {
                      Icon(Icons.Default.KeyboardArrowRight, null, tint = Color.White)
                  }
                  Box(
                      modifier = Modifier.size(80.dp).clip(CircleShape).background(Color(0xFF32343A)).clickable { onCommand(RemoteCommand.SELECT) },
                      contentAlignment = Alignment.Center
                  ) {
                      Text("OK", color = Color.White)
                  }
              }
          }

          @Composable
          fun CapsuleRocker(labelUp: String, labelDown: String, onUp: () -> Unit, onDown: () -> Unit, modifier: Modifier = Modifier) {
              Column(
                  modifier = modifier.width(64.dp).height(120.dp).glassmorphic(28.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Box(Modifier.weight(1f).fillMaxWidth().clickable { onUp() }, contentAlignment = Alignment.Center) {
                      Text(labelUp, color = Color.White)
                  }
                  Divider(color = Color.White.copy(alpha = 0.1f), thickness = 0.5.dp)
                  Box(Modifier.weight(1f).fillMaxWidth().clickable { onDown() }, contentAlignment = Alignment.Center) {
                      Text(labelDown, color = Color.White)
                  }
              }
          }
          """

          files["app/src/main/java/com/cmf/tvremote/MainActivity.kt"] = """package com.cmf.tvremote
          import android.app.Application
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.viewModels
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.AndroidViewModel
          import com.cmf.tvremote.data.ir.IrHardwareManager
          import com.cmf.tvremote.domain.model.*
          import com.cmf.tvremote.presentation.components.*
          import kotlinx.coroutines.flow.MutableStateFlow

          class RemoteViewModel(application: Application) : AndroidViewModel(application) {
              private val irHardwareManager = IrHardwareManager(application)
              val state = MutableStateFlow(TvConnectionState())
              val isIrSupported = irHardwareManager.isIrSupported
              fun send(cmd: RemoteCommand) {}
          }

          class MainActivity : ComponentActivity() {
              private val viewModel: RemoteViewModel by viewModels()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      val conn by viewModel.state.collectAsState()
                      Surface(
                          modifier = Modifier.fillMaxSize().background(
                              Brush.verticalGradient(listOf(Color(0xFF16181C), Color(0xFF090A0D)))
                          ),
                          color = Color.Transparent
                      ) {
                          Column(
                              modifier = Modifier.fillMaxSize().statusBarsPadding().padding(16.dp).verticalScroll(rememberScrollState()),
                              horizontalAlignment = Alignment.CenterHorizontally,
                              verticalArrangement = Arrangement.spacedBy(20.dp)
                          ) {
                              Column(modifier = Modifier.fillMaxWidth().glassmorphic().padding(16.dp)) {
                                  Text("Xiaomi Google TV", color = Color.White, fontSize = 18.sp)
                                  Text("IP: " + conn.connectedIp + " • " + conn.pingLatencyMs + "ms", color = Color(0xFF4ADE80), fontSize = 12.sp)
                                  Spacer(Modifier.height(8.dp))
                                  Text("Now Playing: " + conn.nowPlayingTitle, color = Color.White.copy(alpha = 0.8f), fontSize = 14.sp)
                              }

                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Box(Modifier.size(48.dp).glassmorphic(24.dp).clickable { viewModel.send(RemoteCommand.POWER) }, contentAlignment = Alignment.Center) {
                                      Icon(Icons.Default.PowerSettingsNew, null, tint = Color(0xFFFF453A))
                                  }
                              }

                              TactileDPad(onCommand = { viewModel.send(it) })

                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                                  IconButton(onClick = { viewModel.send(RemoteCommand.BACK) }) { Icon(Icons.Default.ArrowBack, null, tint = Color.White) }
                                  IconButton(onClick = { viewModel.send(RemoteCommand.HOME) }) { Icon(Icons.Default.Home, null, tint = Color.White) }
                                  IconButton(onClick = { viewModel.send(RemoteCommand.ASSISTANT) }) { Icon(Icons.Default.Mic, null, tint = Color.White) }
                              }

                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                                  CapsuleRocker("+", "-", onUp = { viewModel.send(RemoteCommand.VOLUME_UP) }, onDown = { viewModel.send(RemoteCommand.VOLUME_DOWN) })
                                  CapsuleRocker("∧", "∨", onUp = {}, onDown = {})
                              }

                              Box(Modifier.fillMaxWidth().glassmorphic(16.dp).padding(12.dp), contentAlignment = Alignment.Center) {
                                  Text(
                                      text = if (viewModel.isIrSupported) "IR Blaster: Active" else "IR Blaster: Not Supported on CMF Phone (2) (Using Wi-Fi)",
                                      color = Color.White.copy(alpha = 0.6f),
                                      fontSize = 11.sp
                                  )
                              }
                          }
                      }
                  }
              }
          }
          """

          for path, content in files.items():
              dir_name = os.path.dirname(path)
              if dir_name:
                  os.makedirs(dir_name, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip() + "\n")

          print("Generated project with AndroidX support successfully.")
          EOF

      - name: Create Project ZIP Archive
        run: |
          zip -r cmf-tv-remote-source.zip settings.gradle.kts build.gradle.kts gradle.properties app/

      - name: Upload Project ZIP (Full Source Code)
        uses: actions/upload-artifact@v4
        with:
          name: CMF-Remote-Source-ZIP
          path: cmf-tv-remote-source.zip

      - name: Assemble Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK (App Installer)
        uses: actions/upload-artifact@v4
        with:
          name: CMF-Remote-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
