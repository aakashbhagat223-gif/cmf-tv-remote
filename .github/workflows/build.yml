                                  .clickable { onCommand(RemoteCommand.POWER) },
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(Icons.Default.PowerSettingsNew, "Power", tint = Color(0xFFFF453A), modifier = Modifier.size(20.dp))
                          }
                      }

                      SquircleDPad(onCommand = onCommand, radius = settings.cornerRadius)

                      Row(Modifier.fillMaxWidth(0.85f), horizontalArrangement = Arrangement.SpaceBetween) {
                          IconButton(onClick = { onCommand(RemoteCommand.BACK) }) {
                              Icon(Icons.AutoMirrored.Filled.ArrowBack, "Back", tint = Color.White, modifier = Modifier.size(22.dp))
                          }
                          IconButton(onClick = { onCommand(RemoteCommand.HOME) }) {
                              Icon(Icons.Default.Home, "Home", tint = Color.White, modifier = Modifier.size(26.dp))
                          }
                          IconButton(onClick = { onCommand(RemoteCommand.ASSISTANT) }) {
                              Icon(Icons.Default.Mic, "Mic", tint = Color.White, modifier = Modifier.size(24.dp))
                          }
                      }

                      Row(Modifier.fillMaxWidth(0.82f), horizontalArrangement = Arrangement.SpaceBetween) {
                          GlassCapsuleRocker(
                              onPlus = { onCommand(RemoteCommand.VOLUME_UP) },
                              onMinus = { onCommand(RemoteCommand.VOLUME_DOWN) }
                          )
                          GlassCapsuleRocker(
                              onPlus = { onCommand(RemoteCommand.DPAD_UP) },
                              onMinus = { onCommand(RemoteCommand.DPAD_DOWN) }
                          )
                      }

                      Text("Google TV Remote v2 Protocol (Port 6466)", color = Color.White.copy(alpha = 0.45f), fontSize = 10.sp)
                  }
                  Spacer(Modifier.height(16.dp))
              }
          }

          @Composable
          fun DashboardTabScreen(
              telemetry: TvTelemetry,
              onIncrement: () -> Unit,
