name: Build App from Uploaded Files

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository so GitHub Actions can see your uploaded files
      - name: Checkout Uploaded Repository Files
        uses: actions/checkout@v4

      # Step 2: Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Gradle 8.6
      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      # Step 4: Wire the uploaded files into the Android project structure
      - name: Assemble Project Structure
        run: |
          python3 - << 'EOF'
          import os
          import shutil

          target_dir = "app/src/main/java/com/cmf/tvremote"
          os.makedirs(target_dir, exist_ok=True)
          os.makedirs("app/src/main/java/com/cmf/tvremote/domain/model", exist_ok=True)
          os.makedirs("app/src/main/java/com/cmf/tvremote/data/ir", exist_ok=True)
          os.makedirs("app/src/main/java/com/cmf/tvremote/data/network", exist_ok=True)

          # Auto-discover and move the 3 uploaded files wherever they were placed in the repo
          target_files = ["SettingsEngine.kt", "Components.kt", "MainActivity.kt"]
          for fname in target_files:
              found = False
              for root, dirs, files in os.walk("."):
                  if ".git" in root or "build" in root:
                      continue
                  if fname in files:
                      src = os.path.join(root, fname)
                      dest = os.path.join(target_dir, fname)
                      if os.path.abspath(src) != os.path.abspath(dest):
                          print(f"Moving uploaded file {src} -> {dest}")
                          shutil.copy2(src, dest)
                      else:
                          print(f"File {fname} is already in the correct directory.")
                      found = True
                      break
              if not found:
                  print(f"Warning: {fname} was not found in repo; checking standard location.")

          # Supporting build and scaffolding files
          scaffolding = {}

          scaffolding["gradle.properties"] = """
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          """

          scaffolding["settings.gradle.kts"] = """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "cmf-tv-remote"
          include(":app")
          """

          scaffolding["build.gradle.kts"] = """
          plugins {
              id("com.android.application") version "8.4.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          """

          scaffolding["app/build.gradle.kts"] = """
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.cmf.tvremote"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.cmf.tvremote"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 5
                  versionName = "2.1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                      excludes += "META-INF/INDEX.LIST"
                      excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
                      excludes += "META-INF/*.version"
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5")
              implementation("androidx.activity:activity-compose:1.9.2")
              
              val composeBom = platform("androidx.compose:compose-bom:2024.04.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          """

          scaffolding["app/src/main/AndroidManifest.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-feature android:name="android.hardware.consumerir" android:required="false" />
              <application
                  android:name=".RemoteApplication"
                  android:allowBackup="true"
                  android:label="TV Remote"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """

          scaffolding["app/src/main/java/com/cmf/tvremote/RemoteApplication.kt"] = """package com.cmf.tvremote
          import android.app.Application

          class RemoteApplication : Application()
          """

          scaffolding["app/src/main/java/com/cmf/tvremote/domain/model/Models.kt"] = """package com.cmf.tvremote.domain.model

          enum class RemoteCommand(val keyCode: Int) {
              POWER(26),
              DPAD_UP(19),
              DPAD_DOWN(20),
              DPAD_LEFT(21),
              DPAD_RIGHT(22),
              SELECT(66),
              BACK(4),
              HOME(3),
              ASSISTANT(219),
              VOLUME_UP(24),
              VOLUME_DOWN(25)
          }

          data class TvConnectionState(
              val isConnected: Boolean = true,
              val connectedIp: String = "192.168.1.114",
              val pingLatencyMs: Long = 12,
              val statusText: String = "Now Playing: Interstellar"
          )
          """

          scaffolding["app/src/main/java/com/cmf/tvremote/data/ir/IrHardwareManager.kt"] = """package com.cmf.tvremote.data.ir
          import android.content.Context
          import android.content.pm.PackageManager

          class IrHardwareManager(private val context: Context) {
              val isIrSupported: Boolean
                  get() = context.packageManager.hasSystemFeature(PackageManager.FEATURE_CONSUMER_IR)
          }
          """

          scaffolding["app/src/main/java/com/cmf/tvremote/data/network/TvSocketManager.kt"] = """package com.cmf.tvremote.data.network

          import android.content.Context
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import com.cmf.tvremote.domain.model.RemoteCommand
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.OutputStream
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.security.SecureRandom
          import java.security.cert.X509Certificate
          import javax.net.ssl.SSLContext
          import javax.net.ssl.SSLSocket
          import javax.net.ssl.TrustManager
          import javax.net.ssl.X509TrustManager

          object TvSocketManager {
              private var activeSocket: Socket? = null
              private var outputStream: OutputStream? = null

              fun isWifiConnected(context: Context): Boolean {
                  val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val cap = cm.getNetworkCapabilities(cm.activeNetwork) ?: return false
                  return cap.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)
              }

              suspend fun connect(context: Context, ip: String): Result<String> = withContext(Dispatchers.IO) {
                  if (!isWifiConnected(context)) {
                      return@withContext Result.failure(IllegalStateException("Phone is not connected to Wi-Fi!"))
                  }
                  disconnect()

                  val gtvResult = runCatching {
                      val trustAll = arrayOf<TrustManager>(object : X509TrustManager {
                          override fun checkClientTrusted(chain: Array<X509Certificate>?, authType: String?) {}
                          override fun checkServerTrusted(chain: Array<X509Certificate>?, authType: String?) {}
                          override fun getAcceptedIssuers(): Array<X509Certificate> = arrayOf()
                      })
                      val sslContext = SSLContext.getInstance("TLSv1.3").apply {
                          init(null, trustAll, SecureRandom())
                      }
                      val socket = sslContext.socketFactory.createSocket() as SSLSocket
                      socket.connect(InetSocketAddress(ip, 6466), 3000)
                      socket.startHandshake()
                      activeSocket = socket
                      outputStream = socket.outputStream
                      "Google TV TLS (Port 6466)"
                  }

                  if (gtvResult.isSuccess) return@withContext Result.success(gtvResult.getOrThrow())

                  val adbResult = runCatching {
                      val socket = Socket()
                      socket.connect(InetSocketAddress(ip, 5555), 3000)
                      activeSocket = socket
                      outputStream = socket.outputStream
                      "Network ADB (Port 5555)"
                  }

                  if (adbResult.isSuccess) return@withContext Result.success(adbResult.getOrThrow())

                  Result.failure(Exception("Could not connect to TV. Check Wi-Fi & IP."))
              }

              suspend fun sendCommand(command: RemoteCommand): Result<Unit> = withContext(Dispatchers.IO) {
                  runCatching {
                      val out = outputStream ?: throw IllegalStateException("Not connected")
                      val payload = byteArrayOf(0x52, 0x02, command.keyCode.toByte(), 0x01)
                      out.write(payload.size)
                      out.write(payload)
                      out.flush()
                  }
              }

              fun disconnect() {
                  runCatching {
                      outputStream?.close()
                      activeSocket?.close()
                  }
                  outputStream = null
                  activeSocket = null
              }
          }
          """

          for path, content in scaffolding.items():
              dir_name = os.path.dirname(path)
              if dir_name:
                  os.makedirs(dir_name, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip() + "\n")

          print("Integrated uploaded files and scaffolding successfully.")
          EOF

      # Step 5: Compile the project using your 3 uploaded files
      - name: Assemble Debug APK
        run: gradle assembleDebug --no-daemon

      # Step 6: Upload the newly generated APK installer
      - name: Upload Debug APK (App Installer)
        uses: actions/upload-artifact@v4
        with:
          name: CMF-Remote-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
