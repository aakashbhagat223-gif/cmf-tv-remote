          class RemoteViewModel(application: Application) : AndroidViewModel(application) {
              private val context = application.applicationContext
              private val settingsEngine = SettingsEngine(context)

              private val _telemetry = MutableStateFlow(TvTelemetry())
              val telemetry = _telemetry.asStateFlow()

              var activePairingSession by mutableStateOf<GoogleTvProtocol.PairingSession?>(null)

              val settings = settingsEngine.settingsFlow.stateIn(
                  scope = viewModelScope,
                  started = SharingStarted.WhileSubscribed(5000),
                  initialValue = RemoteUiSettings()
              )

              init {
                  viewModelScope.launch {
                      settingsEngine.savedIpFlow.collect { savedIp ->
                          if (savedIp.isNotBlank()) {
                              refreshNetworkInfo(savedIp)
                              connectCommandChannel(savedIp)
                          } else {
                              refreshNetworkInfo("Not set")
                          }
                      }
                  }
              }

              fun connectCommandChannel(ip: String) {
                  viewModelScope.launch {
                      _telemetry.value = _telemetry.value.copy(
                          status = ConnectionStatus.CONNECTING,
                          statusMessage = "Connecting to TV..."
                      )
                      val res = GoogleTvProtocol.connectCommandChannel(ip)
                      if (res.isSuccess) {
                          _telemetry.value = _telemetry.value.copy(
                              status = ConnectionStatus.CONNECTED,
                              statusMessage = "Connected to Google TV"
                          )
                      } else {
                          _telemetry.value = _telemetry.value.copy(
                              status = ConnectionStatus.DISCONNECTED,
                              statusMessage = "Tap to pair or connect"
                          )
                      }
                  }
              }

              fun refreshNetworkInfo(targetIp: String) {
                  val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val wm = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                  val network = cm.activeNetwork
                  val cap = cm.getNetworkCapabilities(network)

                  val isWifi = cap?.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) == true
                  val rawSsid = wm.connectionInfo.ssid ?: "Home Wi-Fi"
                  val quoteChar = 34.toChar().toString()
                  val cleanSsid = rawSsid.replace(quoteChar, "")
                  val ssid = if (!isWifi) "Disconnected" else if (cleanSsid.contains("unknown") || cleanSsid.isEmpty()) "Home Wi-Fi" else cleanSsid
                  val speed = if (isWifi) wm.connectionInfo.linkSpeed.toString() + " Mbps" else "0 Mbps"

                  _telemetry.value = _telemetry.value.copy(
                      tvIp = targetIp,
                      wifiSsid = ssid,
                      wifiLinkSpeed = speed
                  )

                  if (targetIp.isNotBlank() && targetIp != "Not set") {
                      viewModelScope.launch(Dispatchers.IO) {
                          val ping = measurePing(targetIp)
                          withContext(Dispatchers.Main) {
                              _telemetry.value = _telemetry.value.copy(pingLatencyMs = ping)
                          }
                      }
                  }
              }

              private fun measurePing(ip: String): Long {
                  return runCatching {
                      val start = System.currentTimeMillis()
                      val s = Socket()
                      s.connect(InetSocketAddress(ip, 6466), 1500)
                      s.close()
                      System.currentTimeMillis() - start
                  }.getOrDefault(0L)
              }

              fun initiatePairing(ip: String) {
                  val cleanIp = ip.trim()
                  viewModelScope.launch {
                      settingsEngine.saveTvIp(cleanIp)
                      refreshNetworkInfo(cleanIp)
                      _telemetry.value = _telemetry.value.copy(
                          status = ConnectionStatus.PAIRING_REQUIRED,
                          statusMessage = "Pairing with " + cleanIp + "..."
                      )
                      val res = GoogleTvProtocol.startPairing(cleanIp)
                      if (res.isSuccess) {
                          activePairingSession = res.getOrNull()
                          _telemetry.value = _telemetry.value.copy(
                              status = ConnectionStatus.PAIRING_REQUIRED,
                              statusMessage = "Enter code shown on TV screen"
                          )
                      } else {
                          _telemetry.value = _telemetry.value.copy(
                              status = ConnectionStatus.DISCONNECTED,
                              statusMessage = res.exceptionOrNull()?.message ?: "Pairing request refused."
                          )
                      }
                  }
              }

              fun submitPairingPin(pin: String) {
                  val session = activePairingSession ?: return
                  viewModelScope.launch {
                      _telemetry.value = _telemetry.value.copy(statusMessage = "Verifying PIN...")
                      val res = session.completeWithPin(pin)
                      if (res.isSuccess) {
                          activePairingSession = null
                          _telemetry.value = _telemetry.value.copy(
                              status = ConnectionStatus.CONNECTED,
                              statusMessage = "Paired! Connecting remote..."
                          )
                          connectCommandChannel(_telemetry.value.tvIp)
                      } else {
                          _telemetry.value = _telemetry.value.copy(
                              statusMessage = res.exceptionOrNull()?.message ?: "Verification failed."
                          )
                      }
                  }
              }

              fun sendCommand(cmd: RemoteCommand) {
                  viewModelScope.launch {
                      GoogleTvProtocol.sendCommand(cmd)
                  }
              }

              fun updateFontScale(scale: Float) = viewModelScope.launch { settingsEngine.updateFontScale(scale) }
              fun updateFontWeight(index: Int) = viewModelScope.launch { settingsEngine.updateFontWeight(index) }
              fun updateSquircleRadius(radiusDp: Float) = viewModelScope.launch { settingsEngine.updateSquircleRadius(radiusDp) }
              fun updateWallpaper(theme: WallpaperTheme) = viewModelScope.launch { settingsEngine.updateWallpaperTheme(theme) }
          }

