          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .statusBarsPadding()
                      .padding(horizontal = 16.dp)
                      .verticalScroll(rememberScrollState()),
                  verticalArrangement = Arrangement.spacedBy(14.dp)
              ) {
                  Text("Dashboard", fontSize = 32.sp, fontWeight = FontWeight.Bold, color = Color.White, modifier = Modifier.padding(top = 8.dp))

                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .clip(RoundedCornerShape(24.dp))
                          .background(Color(0xFF1B1D24))
                          .padding(16.dp)
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Box(
                              modifier = Modifier
                                  .size(72.dp)
                                  .clip(RoundedCornerShape(16.dp))
                                  .background(Brush.radialGradient(listOf(Color(0xFFD946EF), Color(0xFF6366F1))))
                          )
                          Spacer(Modifier.width(16.dp))
                          Column {
                              Text("NOW PLAYING", fontSize = 11.sp, fontWeight = FontWeight.SemiBold, color = Color.White.copy(alpha = 0.5f))
                              Text("Nothing reported", fontSize = 17.sp, fontWeight = FontWeight.Bold, color = Color.White)
